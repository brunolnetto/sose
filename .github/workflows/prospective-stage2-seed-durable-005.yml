name: Seed durable Stage-2 evidence through 5-of-12

on:
  push:
    branches:
      - automation/prospective-stage2-seed-durable-005

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: prospective-stage2-v2
  cancel-in-progress: false

jobs:
  seed-and-advance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e .

      - name: Download exact 4-of-12 predecessor
        uses: actions/download-artifact@v4
        with:
          name: prospective-stage2-v2-37631900370
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37631900370

      - name: Verify predecessor digests
        run: |
          printf '%s  %s\n'             a7af6e5462b7403c97af6fe8d493c01bee545515e20560c8723cee8fec03ad92 previous/cumulative-acquisition.json             457e8dd44af28f6d1d8da9beac658d11ae86ddcc73d5d2c740e22fe02a094f5c previous/prospective-state.json             7f01e0cc27ad52d86541b391e36c7520b2d722fe2665b9e354dcfdeed1e79243 previous/stage2-checkpoint.json             89fe20616183b5ed3aaff2ecdab258f41c3373912365df3dceeb435def267c8e previous/tranche-acquisition.json             | sha256sum --check --strict

      - name: Acquire PR 334
        env:
          SOSE_GITHUB_TOKEN: ${{ github.token }}
          SOSE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path

          from sose.organizational.github_acquisition_v2 import UrllibGitHubJsonClient
          from sose.organizational.prospective_stage2_acquisition_runner_v2 import run_stage2_acquisition_v2

          run_stage2_acquisition_v2(
              repository=os.environ["SOSE_REPOSITORY"],
              pr_numbers=(334,),
              captured_at=datetime.now(timezone.utc),
              model_freeze_path=Path(
                  "docs/organizational/evidence/pr-review-v2-stage1-freeze/model-freeze.json"
              ),
              previous_acquisition_path=Path("previous/cumulative-acquisition.json"),
              previous_state_path=Path("previous/prospective-state.json"),
              previous_checkpoint_path=Path("previous/stage2-checkpoint.json"),
              output_dir=Path("stage2-output"),
              client=UrllibGitHubJsonClient(
                  token=os.environ["SOSE_GITHUB_TOKEN"].strip()
              ),
          )
          PY

      - name: Verify 5-of-12 checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path("stage2-output/stage2-checkpoint.json").read_text(encoding="utf-8")
          )
          assert checkpoint["holdout_observed"] == 5, checkpoint
          assert checkpoint["holdout_target"] == 12, checkpoint
          assert checkpoint["holdout_remaining"] == 7, checkpoint
          assert checkpoint["validation_allowed"] is False, checkpoint
          assert checkpoint["complete"] is False, checkpoint
          assert checkpoint["post_holdout_count"] == 0, checkpoint
          assert checkpoint["holdout_keys"][-1] == ["brunolnetto/sose", 334], checkpoint
          print(json.dumps(checkpoint, indent=2, sort_keys=True))
          PY

      - name: Seed checkpoints 004 and 005 on durable evidence branch
        env:
          SOSE_EVIDENCE_BRANCH: evidence/prospective-v2-stage2
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/stage2-output"
          predecessor="$GITHUB_WORKSPACE/previous"
          worktree="$RUNNER_TEMP/stage2-evidence"

          if git ls-remote --exit-code --heads origin "$SOSE_EVIDENCE_BRANCH" >/dev/null 2>&1; then
            echo "Durable evidence branch already exists; refusing bootstrap overwrite"
            exit 1
          fi

          git worktree add --detach "$worktree" HEAD
          cd "$worktree"
          git switch --orphan "$SOSE_EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true

          root=docs/organizational/evidence/pr-review-v2-stage2-runtime
          mkdir -p "$root/checkpoint-004" "$root/checkpoint-005" "$root/latest"

          for name in cumulative-acquisition.json prospective-state.json stage2-checkpoint.json tranche-acquisition.json; do
            cp "$predecessor/$name" "$root/checkpoint-004/$name"
            cp "$output/$name" "$root/checkpoint-005/$name"
            cp "$output/$name" "$root/latest/$name"
          done

          python - <<PY
          import json
          from pathlib import Path

          root = Path("$root")
          sources = {
              root / "checkpoint-004" / "source.json": {
                  "workflow_run_id": 37631900370,
                  "checkpoint": 4,
                  "source_commit": "36176a1bb31549b2f823755659e048fd2160ec9b",
              },
              root / "checkpoint-005" / "source.json": {
                  "workflow_run_id": int("${GITHUB_RUN_ID}"),
                  "checkpoint": 5,
                  "source_commit": "${GITHUB_SHA}",
              },
              root / "latest" / "source.json": {
                  "workflow_run_id": int("${GITHUB_RUN_ID}"),
                  "checkpoint": 5,
                  "source_commit": "${GITHUB_SHA}",
              },
          }
          for target, payload in sources.items():
              target.write_text(
                  json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root"
          git commit -m "evidence: seed prospective Stage-2 checkpoints 004-005"
          git push origin "HEAD:$SOSE_EVIDENCE_BRANCH"

      - name: Upload immutable 5-of-12 Stage-2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospective-stage2-v2-${{ github.run_id }}
          path: stage2-output/
          if-no-files-found: error
          retention-days: 90
