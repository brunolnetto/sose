name: Archive prospective Stage-2 3-of-12 evidence

on:
  push:
    branches:
      - automation/archive-prospective-stage2-3of12

permissions:
  actions: read
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[stage2-archive]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: automation/archive-prospective-stage2-3of12

      - name: Download exact Stage-2 3-of-12 artifact
        uses: actions/download-artifact@v4
        with:
          name: prospective-stage2-v2-37615948499
          path: stage2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37615948499

      - name: Verify canonical file digests
        run: |
          printf '%s  %s\n'             5d2ae119d7974e8ef2fa6a33235f6df8ac8971e2fcd82268c18e75afbe00963e stage2/cumulative-acquisition.json             9cd5030aba7041d2076795434362f2544382e638e255859e95830e6e63c85088 stage2/prospective-state.json             869e277ea17b925dc5712177938341d15888d4c77fa7b6b4347788cb2a991f4d stage2/stage2-checkpoint.json             7ea9de0f0c90c7014098d080dead2666f870084af2df6f345f4bd449d9bf9003 stage2/tranche-acquisition.json             | sha256sum --check --strict

      - name: Archive exact canonical evidence in Git
        run: |
          destination=docs/organizational/evidence/pr-review-v2-stage2/checkpoint-003
          mkdir -p "$destination"
          cp stage2/cumulative-acquisition.json "$destination/"
          cp stage2/prospective-state.json "$destination/"
          cp stage2/stage2-checkpoint.json "$destination/"
          cp stage2/tranche-acquisition.json "$destination/"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$destination"
          git commit -m "docs: archive Stage-2 checkpoint 3-of-12 [stage2-archive]"
          git push origin HEAD:automation/archive-prospective-stage2-3of12
