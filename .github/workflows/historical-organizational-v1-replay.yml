name: Historical organizational v1 replay gate

on:
  pull_request:
    paths:
      - "src/sose/**"
      - "tests/e2e/sose/persistence/test_postgres_pc6_multiflow_equivalence.py"
      - ".github/workflows/ci.yml"
      - "scripts/**"
      - "uv.lock"
      - "docs/organizational/preregistration/**"
      - ".github/workflows/historical-organizational-v1-replay.yml"
      - ".github/organizational-v1-published-digests.json"
  push:
    branches: [main]
    paths:
      - "src/sose/**"
      - "tests/e2e/sose/persistence/test_postgres_pc6_multiflow_equivalence.py"
      - ".github/workflows/ci.yml"
      - "scripts/**"
      - "uv.lock"
      - "docs/organizational/preregistration/**"
      - ".github/workflows/historical-organizational-v1-replay.yml"
      - ".github/organizational-v1-published-digests.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-historical-v1:
    name: "Historical replay: ${{ matrix.domain }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: manufacturing
            source_sha: "125fb707e5cbed05ac19e6d43bcd0736bd4b14f6"
            result_sha: "f79bd89fc50ca5fadc0788c657cc752d1291dd464fbf1643e660a67667c4338b"
          - domain: o2c
            source_sha: "3c356fea6adba2d27f583d3a1469e5df1c0b651b"
            result_sha: "c51013cb109f67f5e39bb87385f0b666632c2db953d3084d7dd6ce95adc6500c"
          - domain: mro
            source_sha: "3c356fea6adba2d27f583d3a1469e5df1c0b651b"
            result_sha: "7e23c5f230034c3fb4cf79786110332e9b8c6da299a18bd3245a56fc13228740"
    steps:
      - name: Checkout reviewed published-digest gate
        uses: actions/checkout@v7
        with:
          path: gate-source
          persist-credentials: false

      - name: Checkout exact historical scientific source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_sha }}
          path: historical-source
          persist-credentials: false

      - name: Set up locked uv interpreter
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install frozen historical environment
        working-directory: historical-source
        run: uv sync --frozen --extra dev

      - name: Verify checkout identity
        working-directory: historical-source
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Re-execute original v1 without publishing as a new official experiment
        working-directory: historical-source
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          if [ "$DOMAIN" = manufacturing ]; then
            uv run --frozen python -m sose.organizational.manufacturing_official_run \
              --root . --output-dir "historical-replay-${DOMAIN}"
          else
            uv run --frozen python scripts/organizational_official_run.py \
              --domain "$DOMAIN" --root . --output-dir "historical-replay-${DOMAIN}"
          fi

      - name: Independently verify canonical historical result and file digests
        working-directory: historical-source
        env:
          DOMAIN: ${{ matrix.domain }}
          EXPECTED_RESULT_SHA: ${{ matrix.result_sha }}
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          domain = os.environ["DOMAIN"]
          expected = os.environ["EXPECTED_RESULT_SHA"]
          published = json.loads(Path("../gate-source/.github/organizational-v1-published-digests.json").read_text())[domain]
          assert published["source_sha"] == os.environ["SOURCE_SHA"]
          assert published["result_hash"] == expected
          root = Path(f"historical-replay-{domain}")
          evidence = json.loads((root / "evidence-manifest.json").read_text())
          result = json.loads((root / "result-manifest.json").read_text())
          assert evidence["result_hash"] == result["result_hash"] == expected
          assert set(evidence["files"]) == set(published["canonical_files"])
          for name, expected_digest in published["canonical_files"].items():
              actual_digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual_digest == expected_digest, f"published v1 drift: {name}"
              assert evidence["files"][name] == expected_digest, f"manifest v1 drift: {name}"
          runs = json.loads((root / "runs.json").read_text())
          raw = json.loads((root / "evidence.json").read_text())
          assert len(runs) == len(raw) == result["run_count"]
          summary = {
              "domain": domain,
              "historical_source_sha": os.environ["SOURCE_SHA"],
              "result_hash": expected,
              "world_count": result["world_count"],
              "run_count": result["run_count"],
              "canonical_file_digests_verified": len(published["canonical_files"]),
              "comparison_basis": "independent-reviewed-published-sha256",
              "status": "historical-replay-matches-published-v1",
          }
          (root / "historical-replay-audit.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + chr(10), encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Keep evidence or interrupted staging for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-v1-${{ matrix.domain }}-replay
          path: |
            historical-source/historical-replay-${{ matrix.domain }}/
            historical-source/historical-replay-${{ matrix.domain }}.staging/
          retention-days: 30
          if-no-files-found: warn
