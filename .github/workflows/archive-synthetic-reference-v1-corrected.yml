name: Archive Corrected Synthetic Reference v1

on:
  push:
    branches:
      - automation/synthetic-reference-experiment-v1-clean

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[synthetic-archive-v1]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: automation/synthetic-reference-experiment-v1-clean

      - name: Download corrected experiment artifact
        uses: actions/download-artifact@v4
        with:
          name: synthetic-reference-v1-corrected-37640825405
          path: synthetic-reference-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37640825405

      - name: Verify exact corrected artifact contents
        run: |
          printf '%s  %s\n'             b9af4b62e225584375ae48cb1432029c6031ca509a98c0ae8e29d2e5e8c8f87c synthetic-reference-v1/protocol.json             e11f540f9eb269e6b0930e574c23dae40c06f359c409505f701f639061ab78f4 synthetic-reference-v1/worlds.json             428245d1eeb849dc1a9f5a333f92032d3a76c55ed3254ba6e4b51cad2fe7d086 synthetic-reference-v1/report.json             d8bb46df80f678f5ba136e850a2c3cebfb92bce805fe447ee945ff9e87c22ecd synthetic-reference-v1/summary.json             64cbcdf2263032e146c96203a0e0043e2af39669ab622cd2474e85650e248ee0 synthetic-reference-v1/dataset.json             | sha256sum --check --strict

      - name: Replace compact persisted result with corrected run
        run: |
          destination=docs/organizational/evidence/synthetic-reference-v1
          mkdir -p "$destination"
          cp synthetic-reference-v1/protocol.json "$destination/"
          cp synthetic-reference-v1/worlds.json "$destination/"
          cp synthetic-reference-v1/report.json "$destination/"
          cp synthetic-reference-v1/summary.json "$destination/"

          cat > "$destination/manifest.json" <<'JSON'
          {
            "manifest_version": "synthetic-reference-experiment/v1",
            "workflow_run_id": 37640825405,
            "artifact_id": 11491682930,
            "artifact_digest": "sha256:94c71313eb73f758a0b0b72e47c37dd17e79c3d070f3be6e77e35ff3673aeee0",
            "dataset_sha256": "64cbcdf2263032e146c96203a0e0043e2af39669ab622cd2474e85650e248ee0",
            "protocol_sha256": "b9af4b62e225584375ae48cb1432029c6031ca509a98c0ae8e29d2e5e8c8f87c",
            "worlds_sha256": "e11f540f9eb269e6b0930e574c23dae40c06f359c409505f701f639061ab78f4",
            "report_sha256": "428245d1eeb849dc1a9f5a333f92032d3a76c55ed3254ba6e4b51cad2fe7d086",
            "summary_sha256": "d8bb46df80f678f5ba136e850a2c3cebfb92bce805fe447ee945ff9e87c22ecd"
          }
          JSON

          cat > "$destination/RESULT.md" <<'MD'
          # Synthetic organizational reference experiment v1

          This is a **verification experiment against known synthetic generating mechanics**.
          It is not empirical validation and uses no observed organizational outcomes.

          ## Fixed design

          - 12 Latin-hypercube design points.
          - Three arms per design point: baseline, capacity expansion, and strictly rework-reducing automation.
          - 36 worlds total, 16 CRN replications each, 576 replicated runs.
          - Fixed design and root seed: `20261007`.
          - Regime coordinates use exogenous inputs only: arrival rate, service capacity, service CV, rework probability, and transition cost.
          - Baseline rework probability is sampled in `[0.05, 0.40]`; automation sets it to `0.02`, so the intervention reduces rework in every world.
          - WIP, throughput, queueing delay, and lead time are outputs only.

          ## Result

          - Stable worlds: **20 / 36**.
          - Saturated worlds: **16 / 36**.
          - Mean relative error versus stationary M/G/1 ground truth in stable worlds: **6.35%**.
          - Direction recovery for eligible non-null intervention effects: **8 / 8 = 100%**.
          - Null-region effects: **0**.
          - Regime transitions across intervention arms:
            - stable → stable: **8**
            - saturated → stable: **8**
            - saturated → saturated: **8**
            - stable → saturated: **0**

          ## Interpretation

          The reference generator recovers intervention direction for every eligible effect in this design. Analytical lead-time discrepancy remains concentrated near the critical boundary. For stable worlds with offered load below 0.70, mean relative error is approximately **2.36%**; for the two stable worlds with offered load at or above 0.95, mean relative error is approximately **33.11%**. This is consistent with slow finite-horizon convergence of queue backlogs as `ρ → 1`.

          The result therefore supports the intended verification claim: **SOSE can synthesize organizational process data from explicit exogenous mechanics and recover known regime/intervention structure without feeding endogenous outputs back into the DOE coordinates.**

          This does **not** establish empirical validity for real organizations, A1/A2 agency behavior, or transient intervention dynamics. Those are separate experiments.

          ## Provenance

          - Protocol hash: `32479ce47f24d5fbb3f9098cd796f4e62205a9a32c2eec2e4bba846a701ab572`
          - Dataset hash: `7d75888200ab0425d6a88ca3d69bd6f160d06975a53c652f4bf09335a197bfbb`
          - Recovery report hash: `cdbc2b6818a6152588248fe6d22def40b8a9ce8e08389e28480891f7cc42ccb0`
          - Full dataset artifact: GitHub Actions run `37640825405`, artifact `11491682930`.
          MD

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$destination"
          git commit -m "docs: persist corrected synthetic reference v1 [synthetic-archive-v1]"
          git push origin HEAD:automation/synthetic-reference-experiment-v1-clean
