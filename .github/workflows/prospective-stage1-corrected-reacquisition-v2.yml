name: Prospective Stage-1 Corrected Reacquisition v2

on:
  push:
    branches:
      - automation/prospective-stage1-bootstrap-reacquisition-v2

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  reacquire-and-verify-stage1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize registered preregistration document
        run: |
          git show "1cec74738a35ec719d64497164b06c2b39f5e02b:docs/organizational/pr-review-validation-preregistration-v2.json" > registered-protocol-document.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e .

      - name: Reacquire exact frozen Stage-1 identities
        env:
          SOSE_GITHUB_TOKEN: ${{ github.token }}
          SOSE_REPOSITORY: ${{ github.repository }}
          SOSE_PRS: "302,303,304,305,306,307,308,309,310,312,314,316,318,320,321,322,323,324"
          SOSE_REGISTRATION_MERGED_AT: "2026-10-06T14:44:13+00:00"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path

          from sose.organizational.github_acquisition_v2 import UrllibGitHubJsonClient
          from sose.organizational.prospective_stage1_acquisition_runner_v2 import run_stage1_acquisition_v2

          pr_numbers = tuple(
              int(part.strip())
              for part in os.environ["SOSE_PRS"].split(",")
              if part.strip()
          )
          run_stage1_acquisition_v2(
              repository=os.environ["SOSE_REPOSITORY"],
              pr_numbers=pr_numbers,
              captured_at=datetime.now(timezone.utc),
              protocol_document_path=Path("registered-protocol-document.json"),
              registration_merged_at=datetime.fromisoformat(
                  os.environ["SOSE_REGISTRATION_MERGED_AT"]
              ),
              output_dir=Path("stage1-output"),
              client=UrllibGitHubJsonClient(
                  token=os.environ["SOSE_GITHUB_TOKEN"].strip()
              ),
          )
          PY

      - name: Verify corrected Stage-1 readiness and workflow evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path("stage1-output/stage1-readiness.json").read_text(encoding="utf-8")
          )
          acquisition = json.loads(
              Path("stage1-output/cumulative-acquisition.json").read_text(encoding="utf-8")
          )

          assert checkpoint["training_observed"] == 18, checkpoint
          assert checkpoint["training_target"] == 18, checkpoint
          assert checkpoint["training_remaining"] == 0, checkpoint
          assert checkpoint["freeze_allowed"] is True, checkpoint
          assert checkpoint["holdout_exposed"] is False, checkpoint

          records = acquisition["artifacts"]
          assert len(records) == 18, len(records)
          workflow_counts = []
          for artifact in records:
              evidence = artifact["evidence"]
              workflow_counts.append(len(evidence.get("workflow_jobs", [])))

          assert any(count > 0 for count in workflow_counts), workflow_counts
          print(json.dumps({
              "checkpoint": checkpoint,
              "workflow_job_counts": workflow_counts,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload corrected immutable Stage-1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prospective-stage1-corrected-v2-${{ github.run_id }}
          path: stage1-output/
          if-no-files-found: error
          retention-days: 90
