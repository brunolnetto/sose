name: PR369 Targeted Composition Test

on:
  push:
    branches:
      - automation/trading-company-customer-path-v1

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .[test]
      - run: pytest -q tests/integration/sose/composition/test_trading_company_customer_path.py
