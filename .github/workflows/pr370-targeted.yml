name: PR370 Targeted Replenishment Tests

on:
  push:
    branches:
      - automation/trading-company-replenishment-path-v1

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m pytest -q             tests/integration/sose/composition/test_replenishment_domain_contracts.py             tests/integration/sose/composition/test_trading_company_replenishment_path.py
