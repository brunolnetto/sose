name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run pytest
        run: python -m pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOSE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sose
      SOSE_RUN_PROCESS_CHAOS: "1"
      SOSE_RUN_FENCING_CHAOS: "1"
      SOSE_RUN_STORAGE_CHAOS: "1"
      SOSE_FULL_CHAOS_CANONICALS: "1"
      SOSE_FULL_CHAOS_PHASES: "1"
      SOSE_FULL_PROCESS_CHAOS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run authoritative coverage suite
        run: |
          python -m pytest \
            --cov=sose \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=0 \
            --json-report \
            --json-report-file=pytest-report.json

      - name: Analyze codebase quality
        run: |
          codebase-stats coverage.json \
            --report pytest-report.json \
            --source-root src/sose \
            --show all \
            --threshold 100 \
            --top 0 \
            --show-lines \
            | tee codebase-stats-report.txt

      - name: Render coverage hotspots
        run: |
          python scripts/coverage_hotspots.py coverage.json \
            --limit 40 \
            --output coverage-hotspots.md
          cat coverage-hotspots.md

      - name: Enforce coverage floor
        run: coverage report --fail-under=95

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            pytest-report.json
            codebase-stats-report.txt
            coverage-hotspots.md
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  distribution:
    name: distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel in isolated venv
        run: |
          python -m venv /tmp/sose-wheel-smoke
          /tmp/sose-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/sose-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/sose-wheel-smoke/bin/python -m pip check
          cd /tmp
          /tmp/sose-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata
          import sose
          import sose.api

          assert importlib.metadata.version("sose") == sose.__version__
          assert "Engine" in sose.api.__all__
          print(f"validated installed sose {sose.__version__}")
          PY
          /tmp/sose-wheel-smoke/bin/sose --help >/dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Execute reduced benchmark suite
        run: |
          python benchmarks/runtime_baseline.py --quick --output benchmark-results.json
          python benchmarks/persistence_scaling.py \
            --sizes 10,100 \
            --repetitions 1 \
            --output persistence-scaling-smoke.json

      - name: Upload benchmark smoke report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-report
          path: |
            benchmark-results.json
            persistence-scaling-smoke.json
          if-no-files-found: error
          retention-days: 14


  chaos-test:
    name: chaos-test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOSE_FULL_CHAOS_CANONICALS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run deterministic chaos recovery gate
        run: |
          python -m pytest -q \
            tests/e2e/sose/core/test_chaos_gate.py \
            tests/e2e/sose/domain/test_all_domains_warehouse_restart.py \
            --junitxml=chaos-results.xml

      - name: Upload chaos gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-test-report
          path: chaos-results.xml
          if-no-files-found: error
          retention-days: 14


  chaos-process-backend:
    name: chaos process/backend gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOSE_RUN_PROCESS_CHAOS: "1"
      SOSE_FULL_CHAOS_CANONICALS: "1"
      SOSE_FULL_CHAOS_PHASES: "1"
      SOSE_FULL_PROCESS_CHAOS: "1"
      SOSE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sose

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run real process and backend chaos gate
        run: |
          python -m pytest -q \
            tests/e2e/sose/backends/test_process_backend_chaos.py \
            --junitxml=chaos-process-backend-results.xml

      - name: Upload process/backend chaos report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-process-backend-report
          path: chaos-process-backend-results.xml
          if-no-files-found: error
          retention-days: 14


  chaos-fencing-workers:
    name: chaos fencing/worker-death gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOSE_RUN_FENCING_CHAOS: "1"
      SOSE_FULL_CHAOS_CANONICALS: "1"
      SOSE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sose

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run worker-death and fencing chaos
        run: |
          python -m pytest -q \
            tests/e2e/sose/core/test_fencing_worker_chaos.py \
            --junitxml=chaos-fencing-workers.xml

      - name: Upload fencing chaos report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-fencing-workers-report
          path: chaos-fencing-workers.xml
          if-no-files-found: error
          retention-days: 14

  chaos-postgres-infrastructure:
    name: chaos postgres infrastructure gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOSE_RUN_POSTGRES_INFRA_CHAOS: "1"
      SOSE_FULL_CHAOS_CANONICALS: "1"
      SOSE_FULL_CHAOS_PHASES: "1"
      SOSE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sose

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install chaos dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Discover PostgreSQL service container
        run: |
          cid="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n1)"
          test -n "$cid"
          echo "SOSE_POSTGRES_CONTAINER_ID=$cid" >> "$GITHUB_ENV"

      - name: Run PostgreSQL infrastructure chaos
        run: |
          python -m pytest -q \
            tests/e2e/sose/persistence/test_postgres_infrastructure_chaos.py \
            --junitxml=chaos-postgres-infrastructure.xml

      - name: Upload PostgreSQL infrastructure chaos report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-postgres-infrastructure-report
          path: chaos-postgres-infrastructure.xml
          if-no-files-found: error
          retention-days: 14

  chaos-storage:
    name: chaos storage-failure gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SOSE_RUN_STORAGE_CHAOS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run storage failure chaos
        run: |
          python -m pytest -q \
            tests/e2e/sose/core/test_storage_chaos.py \
            --junitxml=chaos-storage-results.xml

      - name: Upload storage chaos report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-storage-report
          path: chaos-storage-results.xml
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOSE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sose

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run PostgreSQL conformance, restart, and concurrency tests
        run: |
          python -m pytest -q             tests/e2e/sose/persistence/test_postgres_persistence.py             tests/e2e/sose/persistence/test_postgres_persistence_restart.py             tests/e2e/sose/persistence/test_postgres_authoritative_conformance.py             tests/e2e/sose/persistence/test_postgres_pc6_multiflow_equivalence.py
