name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run pytest
        run: python -m pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run coverage gate
        run: |
          python -m pytest             --cov=sose             --cov-branch             --cov-report=term-missing             --cov-report=xml:coverage.xml             --cov-report=html:htmlcov             --cov-fail-under=80

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  distribution:
    name: distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel in isolated venv
        run: |
          python -m venv /tmp/sose-wheel-smoke
          /tmp/sose-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/sose-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/sose-wheel-smoke/bin/python -m pip check
          cd /tmp
          /tmp/sose-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata
          import sose
          import sose.api

          assert importlib.metadata.version("sose") == sose.__version__
          assert "Engine" in sose.api.__all__
          print(f"validated installed sose {sose.__version__}")
          PY
          /tmp/sose-wheel-smoke/bin/sose --help >/dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Execute reduced benchmark suite
        run: |
          python benchmarks/runtime_baseline.py --quick --output benchmark-results.json
          python benchmarks/persistence_scaling.py \
            --sizes 10,100 \
            --repetitions 1 \
            --output persistence-scaling-smoke.json

      - name: Upload benchmark smoke report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-report
          path: |
            benchmark-results.json
            persistence-scaling-smoke.json
          if-no-files-found: error
          retention-days: 14
