name: Execute prospective v2 model freeze

on:
  push:
    branches:
      - automation/freeze-prospective-v2-stage1-model

permissions:
  contents: write

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[model-freeze]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: automation/freeze-prospective-v2-stage1-model

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e .

      - name: Fit Stage 1 and freeze before Stage 2
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          from sose.organizational.prospective_model_freeze_v2 import (
              freeze_prospective_model_v2,
          )
          from sose.organizational.prospective_stage1_fit_v2 import (
              fit_stage1_pr_review_v2,
          )
          from sose.organizational.prospective_stage1_v2 import (
              ProspectiveStage1ReadinessCheckpointV2,
          )
          from sose.organizational.prospective_state_v2 import (
              ProspectiveEvidenceStateV2,
          )

          evidence_dir = Path("docs/organizational/evidence/pr-review-v2-stage1")
          output_dir = Path("docs/organizational/evidence/pr-review-v2-stage1-freeze")
          output_dir.mkdir(parents=True, exist_ok=True)

          state = ProspectiveEvidenceStateV2.model_validate_json(
              (evidence_dir / "prospective-state.json").read_text(encoding="utf-8")
          )
          readiness = ProspectiveStage1ReadinessCheckpointV2.model_validate_json(
              (evidence_dir / "stage1-readiness.json").read_text(encoding="utf-8")
          )

          expected_state_hash = "ec96209137db9e46322cb2da572377b1b592e508f88515e881e8c875b1d87fd0"
          expected_snapshot_hash = "23b35742cab04156460418056983d2c32ed68464fb8b503d681526d52ef422b3"
          expected_readiness_hash = "968bae3f1fefcb03a835c5b3e1d457e086c1ad057c9345337d66475a7cafa5a0"
          assert state.state_hash == expected_state_hash
          assert state.snapshot_hash == expected_snapshot_hash
          assert readiness.checkpoint_hash == expected_readiness_hash
          assert readiness.freeze_allowed is True
          assert readiness.holdout_exposed is False

          fit = fit_stage1_pr_review_v2(
              state=state,
              simulation_seed=20261005,
              acceptance_bootstrap_seed=20261006,
              acceptance_bootstrap_replicates=4096,
              acceptance_quantile=0.95,
          )
          frozen_at = datetime.now(timezone.utc)
          result = freeze_prospective_model_v2(
              state=state,
              readiness=readiness,
              frozen_at=frozen_at,
              model_spec=fit.model_spec,
              simulation_seed=fit.simulation_seed,
              acceptance_criteria=fit.acceptance_criteria,
              tail_metrics=fit.tail_metrics,
              source_normalization_rules=fit.source_normalization_rules,
              missing_data_policy=fit.missing_data_policy,
              fitting_rule=fit.fitting_rule,
          )

          (output_dir / "stage1-fit.json").write_text(
              fit.canonical_json() + "\n", encoding="utf-8"
          )
          (output_dir / "model-freeze.json").write_text(
              result.artifact.canonical_json() + "\n", encoding="utf-8"
          )
          (output_dir / "frozen-state.json").write_text(
              result.frozen_state.canonical_json() + "\n", encoding="utf-8"
          )
          summary = {
              "frozen_at": frozen_at.isoformat(),
              "fit_hash": fit.fit_hash,
              "model_spec_hash": fit.model_spec_hash,
              "acceptance_criteria_hash": fit.acceptance_criteria_hash,
              "acceptance_criteria": fit.acceptance_criteria.model_dump(mode="json"),
              "freeze_hash": result.artifact.freeze_hash,
              "frozen_state_hash": result.frozen_state.state_hash,
              "training_state_hash": fit.training_state_hash,
              "snapshot_hash": fit.snapshot_hash,
              "training_items": len(fit.training_keys),
              "human_analogs": len(fit.model.human_analogs),
              "bot_analogs": len(fit.model.bot_analogs),
              "simulation_seed": fit.simulation_seed,
              "acceptance_bootstrap_seed": fit.acceptance_bootstrap_seed,
              "acceptance_bootstrap_replicates": fit.acceptance_bootstrap_replicates,
              "acceptance_quantile": fit.acceptance_quantile,
              "cohort_status_after_freeze": result.frozen_state.cohort.status.value,
              "holdout_items_after_freeze": len(result.frozen_state.cohort.holdout_keys),
          }
          (output_dir / "freeze-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Persist immutable fit and freeze artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/organizational/evidence/pr-review-v2-stage1-freeze/
          git commit -m "docs: persist prospective v2 model freeze [model-freeze]"
          git push origin HEAD:automation/freeze-prospective-v2-stage1-model
