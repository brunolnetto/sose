name: Archive corrected Stage-1 evidence v2

on:
  push:
    branches:
      - automation/persist-corrected-stage1-evidence-manifest-v2

permissions:
  actions: read
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[stage1-archive]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: automation/persist-corrected-stage1-evidence-manifest-v2

      - name: Download exact corrected Stage-1 artifact
        uses: actions/download-artifact@v4
        with:
          name: prospective-stage1-corrected-v2-37548381207
          path: corrected
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37548381207

      - name: Verify canonical file digests
        run: |
          printf '%s  %s\n'             c98f0e5053e54087e2f726798db3af795178f55ee9056bab8fa342fa2c4f787f corrected/bound-protocol.json             e6edbe75e41aec264ecc33a8ca93b4cd7b819dd958282c93fc79f9b1c78a6101 corrected/cumulative-acquisition.json             a75beef21aff96e84d2c1fc864330f8e7e5ab60b89e2ef73dd4133753de25157 corrected/prospective-state.json             8a4c0bc61ce25558105bfea2c4b28bff76b71b45e9f532475bb76fd1e1f6cdea corrected/stage1-readiness.json             e6edbe75e41aec264ecc33a8ca93b4cd7b819dd958282c93fc79f9b1c78a6101 corrected/tranche-acquisition.json             | sha256sum --check --strict

      - name: Archive exact canonical evidence in Git
        run: |
          destination=docs/organizational/evidence/pr-review-v2-stage1
          mkdir -p "$destination"
          cp corrected/bound-protocol.json "$destination/"
          cp corrected/cumulative-acquisition.json "$destination/"
          cp corrected/prospective-state.json "$destination/"
          cp corrected/stage1-readiness.json "$destination/"
          cp corrected/tranche-acquisition.json "$destination/"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$destination"
          git commit -m "docs: archive exact corrected Stage-1 evidence [stage1-archive]"
          git push origin HEAD:automation/persist-corrected-stage1-evidence-manifest-v2
