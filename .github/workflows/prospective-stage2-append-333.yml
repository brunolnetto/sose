name: Prospective Stage-2 Append 333

on:
  push:
    branches:
      - automation/prospective-stage2-append-333

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e .

      - name: Materialize previous Stage-2 bundle from Git archive
        run: |
          mkdir -p previous
          cp docs/organizational/evidence/pr-review-v2-stage2/checkpoint-003/cumulative-acquisition.json previous/cumulative-acquisition.json
          cp docs/organizational/evidence/pr-review-v2-stage2/checkpoint-003/prospective-state.json previous/prospective-state.json
          cp docs/organizational/evidence/pr-review-v2-stage2/checkpoint-003/stage2-checkpoint.json previous/stage2-checkpoint.json

      - name: Acquire PR 333
        env:
          SOSE_GITHUB_TOKEN: ${{ github.token }}
          SOSE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path

          from sose.organizational.github_acquisition_v2 import UrllibGitHubJsonClient
          from sose.organizational.prospective_stage2_acquisition_runner_v2 import run_stage2_acquisition_v2

          run_stage2_acquisition_v2(
              repository=os.environ["SOSE_REPOSITORY"],
              pr_numbers=(333,),
              captured_at=datetime.now(timezone.utc),
              model_freeze_path=Path(
                  "docs/organizational/evidence/pr-review-v2-stage1-freeze/model-freeze.json"
              ),
              previous_acquisition_path=Path("previous/cumulative-acquisition.json"),
              previous_state_path=Path("previous/prospective-state.json"),
              previous_checkpoint_path=Path("previous/stage2-checkpoint.json"),
              output_dir=Path("stage2-output"),
              client=UrllibGitHubJsonClient(
                  token=os.environ["SOSE_GITHUB_TOKEN"].strip()
              ),
          )
          PY

      - name: Verify 4-of-12 checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path("stage2-output/stage2-checkpoint.json").read_text(encoding="utf-8")
          )
          assert checkpoint["holdout_observed"] == 4, checkpoint
          assert checkpoint["holdout_target"] == 12, checkpoint
          assert checkpoint["holdout_remaining"] == 8, checkpoint
          assert checkpoint["validation_allowed"] is False, checkpoint
          assert checkpoint["complete"] is False, checkpoint
          assert checkpoint["post_holdout_count"] == 0, checkpoint
          assert checkpoint["holdout_keys"][-1] == ["brunolnetto/sose", 333], checkpoint
          print(json.dumps(checkpoint, indent=2, sort_keys=True))
          PY

      - name: Upload immutable Stage-2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prospective-stage2-v2-${{ github.run_id }}
          path: stage2-output/
          if-no-files-found: error
          retention-days: 90
