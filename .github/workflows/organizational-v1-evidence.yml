name: Organizational v1 evidence

on:
  pull_request:
    paths:
      # Historical v1 replay gate.
      - "src/sose/**"
      - "tests/e2e/sose/persistence/test_postgres_pc6_multiflow_equivalence.py"
      - "tests/e2e/sose/persistence/test_postgres_od5a_*.py"
      - ".github/workflows/ci.yml"
      - "scripts/**"
      - "uv.lock"
      - "docs/organizational/preregistration/**"
      - ".github/workflows/historical-organizational-v1-replay.yml"
      - ".github/organizational-v1-published-digests.json"
      - "docs/architecture/decisions/adr-0007-versioned-scientific-freezes.md"
      - "tests/unit/sose/organizational/test_historical_replay_governance.py"
      - "tests/unit/sose/organizational/**"
      - "tests/integration/sose/examples/warehouse_fulfillment/**"
      # Manufacturing v1 provenance gate.
      - ".github/workflows/manufacturing-v1-evidence.yml"
      # Official O2C/MRO v1 provenance gate.
      - "scripts/organizational_official_run.py"
      - ".github/workflows/organizational-official-evidence.yml"
      # The consolidated workflow replaces all three prior definitions.
      - ".github/workflows/organizational-v1-evidence.yml"
  push:
    branches: [main]
    paths:
      - "src/sose/**"
      - "tests/e2e/sose/persistence/test_postgres_pc6_multiflow_equivalence.py"
      - "tests/e2e/sose/persistence/test_postgres_od5a_*.py"
      - ".github/workflows/ci.yml"
      - "scripts/**"
      - "uv.lock"
      - "docs/organizational/preregistration/**"
      - ".github/workflows/historical-organizational-v1-replay.yml"
      - ".github/organizational-v1-published-digests.json"
      - "docs/architecture/decisions/adr-0007-versioned-scientific-freezes.md"
      - "tests/unit/sose/organizational/test_historical_replay_governance.py"
      - "tests/unit/sose/organizational/**"
      - "tests/integration/sose/examples/warehouse_fulfillment/**"
      - ".github/workflows/manufacturing-v1-evidence.yml"
      - "scripts/organizational_official_run.py"
      - ".github/workflows/organizational-official-evidence.yml"
      - ".github/workflows/organizational-v1-evidence.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Select the evidence gate to run (or run all three)."
        required: true
        default: historical-replay
        type: choice
        options:
          - historical-replay
          - manufacturing-evidence
          - official-o2c-mro
          - all

permissions:
  contents: read

jobs:
  select-suites:
    name: Select evidence suites
    runs-on: ubuntu-latest
    outputs:
      historical: ${{ steps.select.outputs.historical }}
      manufacturing: ${{ steps.select.outputs.manufacturing }}
      official: ${{ steps.select.outputs.official }}
    steps:
      - name: Checkout event commits for path classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve the original workflow-specific path routing
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          SELECTED_SUITE: ${{ inputs.suite || 'historical-replay' }}
        run: |
          set -euo pipefail

          historical=false
          manufacturing=false
          official=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$SELECTED_SUITE" in
              historical-replay) historical=true ;;
              manufacturing-evidence) manufacturing=true ;;
              official-o2c-mro) official=true ;;
              all)
                historical=true
                manufacturing=true
                official=true
                ;;
              *)
                echo "Unsupported suite: $SELECTED_SUITE" >&2
                exit 2
                ;;
            esac
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              changed_paths="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
            elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              changed_paths="$(git ls-tree -r --name-only "$PUSH_SHA")"
            else
              changed_paths="$(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_SHA")"
            fi

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                src/sose/*|\
                tests/e2e/sose/persistence/test_postgres_pc6_multiflow_equivalence.py|\
                tests/e2e/sose/persistence/test_postgres_od5a_*.py|\
                .github/workflows/ci.yml|\
                scripts/*|\
                uv.lock|\
                docs/organizational/preregistration/*|\
                .github/workflows/historical-organizational-v1-replay.yml|\
                .github/organizational-v1-published-digests.json|\
                docs/architecture/decisions/adr-0007-versioned-scientific-freezes.md|\
                tests/unit/sose/organizational/test_historical_replay_governance.py|\
                tests/unit/sose/organizational/*|\
                tests/integration/sose/examples/warehouse_fulfillment/*|\
                .github/workflows/organizational-v1-evidence.yml)
                  historical=true
                  ;;
              esac
              case "$path" in
                .github/workflows/manufacturing-v1-evidence.yml|\
                .github/workflows/organizational-v1-evidence.yml)
                  manufacturing=true
                  ;;
              esac
              case "$path" in
                scripts/organizational_official_run.py|\
                .github/workflows/organizational-official-evidence.yml|\
                .github/workflows/organizational-v1-evidence.yml)
                  official=true
                  ;;
              esac
            done <<< "$changed_paths"
          fi

          {
            echo "historical=$historical"
            echo "manufacturing=$manufacturing"
            echo "official=$official"
          } >> "$GITHUB_OUTPUT"

  replay-historical-v1:
    name: "Historical replay: ${{ matrix.domain }}"
    needs: [select-suites]
    if: needs.select-suites.outputs.historical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: manufacturing
            source_sha: "125fb707e5cbed05ac19e6d43bcd0736bd4b14f6"
            result_sha: "f79bd89fc50ca5fadc0788c657cc752d1291dd464fbf1643e660a67667c4338b"
          - domain: o2c
            source_sha: "3c356fea6adba2d27f583d3a1469e5df1c0b651b"
            result_sha: "c51013cb109f67f5e39bb87385f0b666632c2db953d3084d7dd6ce95adc6500c"
          - domain: mro
            source_sha: "3c356fea6adba2d27f583d3a1469e5df1c0b651b"
            result_sha: "7e23c5f230034c3fb4cf79786110332e9b8c6da299a18bd3245a56fc13228740"
    steps:
      - name: Checkout reviewed published-digest gate
        uses: actions/checkout@v7
        with:
          path: gate-source
          persist-credentials: false

      - name: Checkout exact historical scientific source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_sha }}
          path: historical-source
          persist-credentials: false

      - name: Set up locked uv interpreter
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install frozen historical environment
        working-directory: historical-source
        run: uv sync --frozen --extra dev

      - name: Verify immutable historical freeze governance
        working-directory: historical-source
        run: |
          uv run --frozen python ../gate-source/scripts/verify_organizational_v1_replay_contract.py \
            --root ../gate-source --output ../v1-freeze-governance.json

      - name: Verify checkout identity
        working-directory: historical-source
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Re-execute original v1 without publishing as a new official experiment
        working-directory: historical-source
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          if [ "$DOMAIN" = manufacturing ]; then
            uv run --frozen python -m sose.organizational.manufacturing_official_run \
              --root . --output-dir "historical-replay-${DOMAIN}"
          else
            uv run --frozen python scripts/organizational_official_run.py \
              --domain "$DOMAIN" --root . --output-dir "historical-replay-${DOMAIN}"
          fi

      - name: Independently verify canonical historical result and file digests
        working-directory: historical-source
        env:
          DOMAIN: ${{ matrix.domain }}
          EXPECTED_RESULT_SHA: ${{ matrix.result_sha }}
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          domain = os.environ["DOMAIN"]
          expected = os.environ["EXPECTED_RESULT_SHA"]
          published = json.loads(Path("../gate-source/.github/organizational-v1-published-digests.json").read_text())[domain]
          assert published["source_sha"] == os.environ["SOURCE_SHA"]
          assert published["result_hash"] == expected
          root = Path(f"historical-replay-{domain}")
          evidence = json.loads((root / "evidence-manifest.json").read_text())
          result = json.loads((root / "result-manifest.json").read_text())
          assert evidence["result_hash"] == result["result_hash"] == expected
          assert set(evidence["files"]) == set(published["canonical_files"])
          for name, expected_digest in published["canonical_files"].items():
              actual_digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual_digest == expected_digest, f"published v1 drift: {name}"
              assert evidence["files"][name] == expected_digest, f"manifest v1 drift: {name}"
          runs = json.loads((root / "runs.json").read_text())
          raw = json.loads((root / "evidence.json").read_text())
          assert len(runs) == len(raw) == result["run_count"]
          summary = {
              "domain": domain,
              "historical_source_sha": os.environ["SOURCE_SHA"],
              "result_hash": expected,
              "world_count": result["world_count"],
              "run_count": result["run_count"],
              "canonical_file_digests_verified": len(published["canonical_files"]),
              "comparison_basis": "independent-reviewed-published-sha256",
              "status": "historical-replay-matches-published-v1",
          }
          (root / "historical-replay-audit.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + chr(10), encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Keep evidence or interrupted staging for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-v1-${{ matrix.domain }}-replay
          path: |
            historical-source/historical-replay-${{ matrix.domain }}/
            historical-source/historical-replay-${{ matrix.domain }}.staging/
            v1-freeze-governance.json
          retention-days: 30
          if-no-files-found: warn

  manufacturing-v1-evidence:
    needs: [select-suites]
    if: needs.select-suites.outputs.manufacturing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact immutable Manufacturing v1 source
        uses: actions/checkout@v7
        with:
          ref: 125fb707e5cbed05ac19e6d43bcd0736bd4b14f6
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install exact locked experiment dependencies
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Verify immutable checkout commit
        run: test "$(git rev-parse HEAD)" = "125fb707e5cbed05ac19e6d43bcd0736bd4b14f6"

      - name: Synchronize frozen environment
        run: |
          uv sync --frozen --extra dev
          uv pip check --python .venv/bin/python

      - name: Verify frozen scientific configuration
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from sose.organizational.manufacturing_official_run import verify_freeze
          frozen = verify_freeze(Path.cwd())
          print(f"Frozen protocol: {frozen['protocol_hash']}")
          print(f"Frozen plan: {frozen['plan_hash']}")
          PY

      - name: Execute preregistered experiment
        run: |
          uv run --frozen python -m sose.organizational.manufacturing_official_run \
            --root . \
            --output-dir manufacturing-v1-official-evidence

      - name: Record execution environment
        run: |
          uv run --frozen python --version > manufacturing-v1-official-evidence/python-version.txt
          uv pip freeze --python .venv/bin/python > manufacturing-v1-official-evidence/installed-packages.txt
          git rev-parse HEAD > manufacturing-v1-official-evidence/execution-source-head.txt
          sha256sum uv.lock > manufacturing-v1-official-evidence/uv-lock-sha256.txt

      - name: Seal final provenance envelope
        if: success()
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          bundle = Path("manufacturing-v1-official-evidence")
          files = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(bundle.iterdir())
              if path.is_file() and path.name != "final-provenance-manifest.json"
          }
          (bundle / "final-provenance-manifest.json").write_text(
              json.dumps({"files": files}, indent=2, sort_keys=True) + chr(10),
              encoding="utf-8",
          )
          PY

      - name: Validate final audit manifest and every referenced digest
        if: success()
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("manufacturing-v1-official-evidence")
          manifest = json.loads((root / "final-provenance-manifest.json").read_text(encoding="utf-8"))
          files = manifest["files"]
          assert files, "final provenance must list audit artifacts"
          assert set(files) == {p.name for p in root.iterdir() if p.is_file() and p.name != "final-provenance-manifest.json"}
          for name, expected in files.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY

      - name: Verify immutable Manufacturing v1 result identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("manufacturing-v1-official-evidence")
          result = json.loads((root / "result-manifest.json").read_text())
          assert result["result_hash"] == "f79bd89fc50ca5fadc0788c657cc752d1291dd464fbf1643e660a67667c4338b"
          assert Path("src/sose/organizational/manufacturing_official_run.py").is_file()
          PY

      # v1 evidence is immutable: verify the original source and preserve a
      # diagnostic Actions artifact; never publish another official v1 release.
      - name: Upload official or failed staging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manufacturing-v1-official-evidence
          path: |
            manufacturing-v1-official-evidence/
            manufacturing-v1-official-evidence.staging/
          if-no-files-found: error
          retention-days: 90

  official-o2c-mro-preflight:
    needs: [select-suites]
    if: needs.select-suites.outputs.official == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check official runner syntax only; never run worlds on a PR
        run: |
          uv sync --frozen --extra dev
          uv run --frozen python -m py_compile scripts/organizational_official_run.py
          uv run --frozen python scripts/organizational_official_run.py --help

  official-o2c-mro-experiment:
    needs: [select-suites, official-o2c-mro-preflight]
    if: needs.select-suites.outputs.official == 'true'
    # Safe for PRs: replay pinned source, never publish a new official v1 release.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: o2c
            expected_result_sha: c51013cb109f67f5e39bb87385f0b666632c2db953d3084d7dd6ce95adc6500c
          - domain: mro
            expected_result_sha: 7e23c5f230034c3fb4cf79786110332e9b8c6da299a18bd3245a56fc13228740
    steps:
      - name: Checkout exact immutable O2C/MRO v1 source
        uses: actions/checkout@v7
        with:
          ref: 3c356fea6adba2d27f583d3a1469e5df1c0b651b
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Verify approved historical source identity
        run: test "$(git rev-parse HEAD)" = "3c356fea6adba2d27f583d3a1469e5df1c0b651b"
      - name: Install exact locked dependencies
        run: uv sync --frozen --extra dev
      - name: Verify separate scientific freeze without executing any world
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from scripts.organizational_official_run import verify_freeze
          import os
          domain = os.environ["DOMAIN"]
          manifest = verify_freeze(root=Path.cwd(), domain=domain)
          print(f"Freeze valid: {domain}; protocol={manifest['protocol_hash']}")
          PY
        env:
          DOMAIN: ${{ matrix.domain }}
      - name: Execute exactly the frozen configuration
        run: |
          uv run --frozen python scripts/organizational_official_run.py \
            --domain "${{ matrix.domain }}" --root . \
            --output-dir "official-${{ matrix.domain }}-v1"
      - name: Record actual execution environment and source provenance
        run: |
          uv run --frozen python --version > "official-${{ matrix.domain }}-v1/python-version.txt"
          uv pip freeze --python .venv/bin/python > "official-${{ matrix.domain }}-v1/installed-packages.txt"
          git rev-parse HEAD > "official-${{ matrix.domain }}-v1/execution-source-head.txt"
          git rev-parse HEAD:src/sose > "official-${{ matrix.domain }}-v1/execution-runtime-tree.txt"
          sha256sum uv.lock > "official-${{ matrix.domain }}-v1/uv-lock-sha256.txt"
          sha256sum scripts/organizational_official_run.py > "official-${{ matrix.domain }}-v1/runner-sha256.txt"
      - name: Seal and validate every published artifact
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          bundle = Path("official-" + os.environ["DOMAIN"] + "-v1")
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(bundle.iterdir()) if p.is_file()}
          final = bundle / "final-provenance-manifest.json"
          final.write_text(json.dumps({"files": files}, indent=2, sort_keys=True) + chr(10))
          loaded = json.loads(final.read_text())
          assert set(loaded["files"]) == {p.name for p in bundle.iterdir()
                                           if p.is_file() and p.name != final.name}
          for name, digest in loaded["files"].items():
              assert hashlib.sha256((bundle / name).read_bytes()).hexdigest() == digest
          PY
        env:
          DOMAIN: ${{ matrix.domain }}
      - name: Assert immutable v1 scientific result
        env:
          DOMAIN: ${{ matrix.domain }}
          EXPECTED_RESULT_SHA: ${{ matrix.expected_result_sha }}
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import json
          import os
          root = Path("official-" + os.environ["DOMAIN"] + "-v1")
          manifest = json.loads((root / "result-manifest.json").read_text())
          assert manifest["result_hash"] == os.environ["EXPECTED_RESULT_SHA"]
          evidence = json.loads((root / "evidence-manifest.json").read_text())
          assert evidence["result_hash"] == os.environ["EXPECTED_RESULT_SHA"]
          PY

      # Never create a new tagged 'v1' release for an immutable result.
      # Approved published SHA-256 sidecars belong to their original execution.
      - name: Preserve complete or interrupted run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-${{ matrix.domain }}-v1-evidence
          path: |
            official-${{ matrix.domain }}-v1/
            official-${{ matrix.domain }}-v1.staging/
          retention-days: 90
          if-no-files-found: warn
