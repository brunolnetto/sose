name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: build and validate release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate version and release note
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_release_candidate.py --tag "$RELEASE_TAG"
          else
            python scripts/check_release_candidate.py
          fi

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel and smoke-test public API
        run: |
          python -m venv /tmp/sose-release-smoke
          /tmp/sose-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/sose-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/sose-release-smoke/bin/python -m pip check
          cd /tmp
          /tmp/sose-release-smoke/bin/python - <<'PY'
          import importlib.metadata
          import sose
          import sose.api

          assert importlib.metadata.version("sose") == sose.__version__
          assert set(sose.api.__all__)
          print(f"release artifact import smoke passed: {sose.__version__}")
          PY

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sose-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30
