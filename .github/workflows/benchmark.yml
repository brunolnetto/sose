name: Runtime benchmarks

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Run reduced benchmark sizes"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "benchmarks/**"
      - "src/sose/core/engine.py"
      - "src/sose/core/diagnostics.py"
      - "src/sose/persistence/**"
      - "tests/unit/sose/domain/test_uow_*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run unified pytest-benchmark suite
        env:
          SOSE_BENCHMARK_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.quick)) && 'quick' || 'full' }}
        run: |
          python -m pytest -o addopts= benchmarks/pytest_benchmarks \
            --benchmark-only \
            --benchmark-json=pytest-benchmark-results.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: runtime-benchmark-results
          path: pytest-benchmark-results.json
          if-no-files-found: error
          retention-days: 90
