[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sose"
version = "0.8.0"
description = "Synthetic Operational System Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-statemachine[io]>=3.2.1,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
sose = "sose.cli:main"

[project.optional-dependencies]
simpy = [
  "simpy>=4.1.1,<5",
]
duckdb = [
  "duckdb>=1.5.5,<2",
]
postgres = [\n  "psycopg[binary]>=3.3.6,<4",\n]\nclickhouse = [\n  "clickhouse-connect>=0.8,<1",\n]\ndatabricks = [
  "databricks-sql-connector>=4,<5",
]
snowflake = [
  "snowflake-connector-python>=4,<5",
]
dev = [
  "simpy>=4.1.1,<5",
  "duckdb>=1.5.5,<2",
  "psycopg[binary]>=3.3.6,<4",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=2.3,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sose"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "duckdb>=1.5.5,<2",
    "psycopg[binary]>=3.3.6,<4",
    "codebase-stats>=0.0.3",
    "simpy>=4.1.1,<5",
]


[tool.coverage.run]
branch = true
source = ["sose"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
