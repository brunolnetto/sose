[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sose"
version = "0.5.0"
description = "Synthetic Operational System Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-statemachine[io]>=3.2.1,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
simpy = [
  "simpy>=4.1.2,<5",
]
dev = [
  "simpy>=4.1.2,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=2.3,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sose"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "codebase-stats>=0.0.3",
]
